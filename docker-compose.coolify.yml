# Postiz v2.25.1 - Coolify Git/Docker Compose deployment
# Source upstream: https://github.com/gitroomhq/postiz-docker-compose
# Coolify: Public repository > Docker Compose, file /docker-compose.coolify.yml
# Only the postiz service should receive a public HTTPS domain (internal port 5000).
# Secrets are generated by Coolify. Never put real passwords in this file.

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.25.1
    restart: unless-stopped
    environment:
      MAIN_URL: "https://postiz.oraclelumira.com"
      FRONTEND_URL: "https://postiz.oraclelumira.com"
      NEXT_PUBLIC_BACKEND_URL: "https://postiz.oraclelumira.com/api"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      JWT_SECRET: ${SERVICE_HEX_64_POSTIZJWT}
      DATABASE_URL: "postgresql://postiz:${SERVICE_PASSWORD_64_POSTIZDB}@postiz-postgres:5432/postiz"
      REDIS_URL: "redis://default:${SERVICE_PASSWORD_64_POSTIZREDIS}@postiz-redis:6379"
      TEMPORAL_ADDRESS: "temporal:7233"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "${POSTIZ_DISABLE_REGISTRATION:-false}"
      RUN_CRON: "true"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
    expose:
      - "5000"
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    networks:
      - postiz-network
      - temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://127.0.0.1:5000/',res=>{res.resume();process.exit(res.statusCode<500?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(5000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s

  postiz-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    environment:
      POSTGRES_USER: "postiz"
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTIZDB}
      POSTGRES_DB: "postiz"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postiz-redis:
    image: redis:7.2
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    environment:
      REDISCLI_AUTH: ${SERVICE_PASSWORD_64_POSTIZREDIS}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${SERVICE_PASSWORD_64_POSTIZREDIS}"]
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
      cluster.routing.allocation.disk.threshold_enabled: "true"
      cluster.routing.allocation.disk.watermark.low: "512mb"
      cluster.routing.allocation.disk.watermark.high: "256mb"
      cluster.routing.allocation.disk.watermark.flood_stage: "128mb"
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  temporal-postgresql:
    image: postgres:16
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    environment:
      POSTGRES_USER: "temporal"
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_TEMPORALDB}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    environment:
      DB: "postgres12"
      DB_PORT: "5432"
      POSTGRES_USER: "temporal"
      POSTGRES_PWD: ${SERVICE_PASSWORD_64_TEMPORALDB}
      POSTGRES_SEEDS: "temporal-postgresql"
      DYNAMIC_CONFIG_FILE_PATH: "config/dynamicconfig/development-sql.yaml"
      ENABLE_ES: "true"
      ES_SEEDS: "temporal-elasticsearch"
      ES_VERSION: "v7"
      TEMPORAL_NAMESPACE: "default"
    networks:
      - temporal-network
    expose:
      - "7233"
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    # Inline file mount is a Coolify-supported feature. It avoids fragile
    # repo-relative directory mounts when Coolify rewrites a Git Compose.
    volumes:
      - type: bind
        source: ./temporal-dynamicconfig.yaml
        target: /etc/temporal/config/dynamicconfig/development-sql.yaml
        content: |
          limit.maxIDLength:
            - value: 255
              constraints: {}
          system.forceSearchAttributesCacheRefreshOnRead:
            - value: true
              constraints: {}
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

volumes:
  postiz-config:
  postiz-uploads:
  postgres-volume:
  postiz-redis-data:
  temporal-postgres-data:
  temporal-elasticsearch-data:

networks:
  postiz-network:
  temporal-network:
